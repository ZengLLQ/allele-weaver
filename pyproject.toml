[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "allele-weaver"
version = "0.1.0"
description = "Clinical pharmacogenomics toolkit for read-backed haplotype phasing, structural CNV star-allele diplotype inference, and genotype-guided pharmacokinetic dosing simulation."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "AlleleWeaver Contributors"},
]
keywords = [
    "pharmacogenomics",
    "haplotype-phasing",
    "bioinformatics",
    "medical-informatics",
    "star-allele-calling",
    "copy-number-variation",
    "hidden-markov-model",
    "pharmacokinetics",
    "precision-medicine",
    "variant-calling",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
]

[project.scripts]
allele-weaver = "allele_weaver.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
